.brand{display:flex;align-items:center;gap:12px}
.auth img{align-self:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.mute{color:var(--mute);margin:8px 0}
.btn{min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--green);background:transparent;color:var(--green);font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--green);color:var(--bg)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
input,select{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font:inherit;max-width:100%}
input[type=range]{width:100%;padding:0;accent-color:var(--green);touch-action:pan-y}
input[type=file]{padding:8px 12px}
.ctrl,.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ctrl>*{min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sound{display:flex;flex-direction:column;gap:6px}
.sound .row{justify-content:space-between}
.pill{border:1px solid var(--green);color:var(--green);border-radius:999px;padding:0 10px;font-size:13px}
.mix{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.auth{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.auth input{width:100%}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--green);background:transparent;color:var(--green);font:inherit;font-weight:700;font-size:20px;cursor:pointer}
dialog.help{width:min(92vw,900px);max-height:85vh;overflow:auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:16px}
dialog.help::backdrop{background:rgba(0,0,0,.65)}
.btn.sm{min-height:40px;padding:0 16px;font-size:15px}
.top{flex-wrap:nowrap;gap:8px}.brand{min-width:0}
.brand h1{font-size:clamp(20px,6vw,28px);white-space:nowrap}
.logo svg{width:clamp(30px,9vw,40px);height:clamp(30px,9vw,40px)}
.top .row{flex-wrap:nowrap;gap:8px}
.top .btn{min-height:36px;padding:0 14px;font-size:14px}
.icon-btn{width:36px;height:36px;font-size:17px}
[hidden]{display:none!important}
.vis{position:fixed;inset:0;z-index:60;background:#001e2b}.vis canvas{width:100%;height:100%;display:block}
.vbar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,30,43,.9));transition:opacity .3s}
.vbar label{display:flex;align-items:center;gap:8px;min-width:140px}
.vis.hide .vbar{opacity:0;pointer-events:none}
.grp{flex:1 1 220px;min-width:0}.nw{flex-wrap:nowrap;gap:8px}.nw select{flex:1;min-width:0}
.mixsave{margin-bottom:14px}.mixsave input{flex:1;min-width:150px}
.guide{display:grid;gap:16px;margin-top:12px}
@media(min-width:768px){.guide{grid-template-columns:1fr 1fr}}
.guide>div{background:#d7f3e3;color:#001e2b;border-radius:12px;padding:14px 18px}
.guide ol{margin:8px 0 0;padding-left:22px}.guide li{margin:8px 0;line-height:1.6}
summary{cursor:pointer;font-weight:600;min-height:32px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:10px 16px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>

<script>

function h(tag,props={},...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){if(k==='class')e.className=v;else if(k.startsWith('on'))e[k]=v;else e.setAttribute(k,v)}
  for(const c of kids.flat())if(c!=null)e.append(c);return e}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3500)}

/* ---------- auth ---------- */
function showAuth(){
  let mode='login';
  const msg=h('p',{class:'mute'});
  const email=h('input',{type:'email',placeholder:'Email',autocomplete:'email'});
  const pass=h('input',{type:'password',placeholder:'Password (min 6 characters)',autocomplete:'current-password'});
  const sw=h('button',{class:'btn',type:'button'},'Create a new account');
  const btn=h('button',{class:'btn primary',type:'submit'},'Log in');
  const form=h('form',{class:'auth'},h('img',{src:'logo.svg',alt:'Hushwave logo',width:'72',height:'72'}),h('h1',{style:'text-align:center'},'Hushwave'),h('p',{class:'mute'},'Mix calming sounds. Sleep easy.'),email,pass,btn,sw,msg);
  sw.onclick=()=>{mode=mode==='login'?'signup':'login';btn.textContent=mode==='login'?'Log in':'Create account';sw.textContent=mode==='login'?'Create a new account':'I already have an account';msg.textContent=''};
  form.onsubmit=async ev=>{ev.preventDefault();msg.textContent='';
    const e=email.value.trim(),p=pass.value;
    if(!e||p.length<6){msg.textContent='Enter an email and a password of at least 6 characters.';return}
    btn.disabled=true;
    const r=mode==='login'?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p});
    btn.disabled=false;
    if(r.error)msg.textContent=r.error.message;
    else if(!r.data.session)msg.textContent='Check your email to confirm your account, then log in.'};
  $('app').replaceChildren(form);
}
sb.auth.onAuthStateChange((ev,session)=>{
  const id=session&&session.user?session.user.id:null;
  if(booted&&id===curId)return;
  booted=true;curId=id;user=session?session.user:null;
  setTimeout(()=>{if(user)startApp();else{stopAudio();showAuth()}},0);
});

  {id:'b:keyboard-tapping',name:'Keyboard tapping',category:'Tapping',builtin:true,url:'sounds/keyboard-tapping.mp3'},

const GUIDE={en:[

ur:[

/* ---------- audio ---------- */
function ensureCtx(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=masterVol;master.connect(ctx.destination)}return ctx}
async function startNode(id){
  if(!ctx||nodes[id]||bad[id])return;
  const s=sounds.find(x=>x.id===id);if(!s)return;
  const n=nodes[id]={gain:ctx.createGain()};n.gain.gain.value=levels[id]||0;n.gain.connect(master);
  try{
    let ab;
    if(s.builtin){const r=await fetch(s.url);if(!r.ok)throw new Error('missing file');ab=await r.arrayBuffer()}
    else{const r=await sb.storage.from(BUCKET).download(s.storage_path);if(r.error)throw r.error;ab=await r.data.arrayBuffer()}
    const buf=await ctx.decodeAudioData(ab);
    if(nodes[id]!==n)return;
    const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;src.connect(n.gain);src.start();n.src=src;
  }catch(e){if(nodes[id]===n)delete nodes[id];bad[id]=true;toast('Could not play "'+s.name+'". Try an mp3 or wav file.')}
}
function dropNode(id){const n=nodes[id];if(!n)return;try{n.src&&n.src.stop()}catch(e){}try{n.gain.disconnect()}catch(e){}delete nodes[id]}
function applyLevel(id){
  const n=nodes[id];
  if(n&&ctx)n.gain.gain.setTargetAtTime(levels[id]||0,ctx.currentTime,.05);
  else if(playing&&levels[id]>0)startNode(id);
}
async function togglePlay(){
  if(playing){await ctx.suspend();playing=false}
  else{
    if(!sounds.some(s=>levels[s.id]>0))toast('Move a slider up to hear a sound.');
    ensureCtx();await ctx.resume();playing=true;
    sounds.forEach(s=>{if(levels[s.id]>0)startNode(s.id)});
  }
  updatePlay();
}
function updatePlay(){document.body.classList.toggle('playing',playing);const vb=$('vplay');if(vb){vb.textContent=playing?'Pause':'Play';vb.className=playing?'btn sm':'btn primary sm'}const b=$('play');if(!b)return;b.textContent=playing?'Pause':'Play';b.className=playing?'btn':'btn primary'}
function stopAudio(){clearInterval(timer);timer=null;Object.keys(nodes).forEach(dropNode);if(ctx){try{ctx.close()}catch(e){}}
  ctx=null;master=null;noiseBuf=null;nodes={};bad={};playing=false;levels={};sounds=[];presets=[]}
function setMaster(v){masterVol=v;if(master)master.gain.setTargetAtTime(v,ctx.currentTime,.05)}

/* ---------- sleep timer ---------- */
const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function startTimer(min){
  cancelTimer();const end=Date.now()+min*60000;
  timer=setInterval(async()=>{
    const r=end-Date.now();
    if(r<=0){clearInterval(timer);timer=null;$('tlabel').textContent='';
      if(playing)await togglePlay();setMaster(masterVol);closeVis();fadeV=1;return}
    if(r<=8000&&master){master.gain.setTargetAtTime(0,ctx.currentTime,2);fadeV=Math.max(0,r/8000)}
    $('tlabel').textContent=fmt(r)+' left';
  },1000);
  toast('Sleep timer started: '+min+' min');
}
function cancelTimer(){fadeV=1;if(timer){clearInterval(timer);timer=null;if($('tlabel'))$('tlabel').textContent='';if(master)master.gain.setTargetAtTime(masterVol,ctx.currentTime,.05)}}

/* ---------- data ---------- */
async function loadSounds(){
  const r=await sb.from('sounds').select('*').order('created_at');
  sounds=BUILTINS.concat(r.error?[]:r.data);drawSounds();
  if(r.error)toast('Could not load sounds: '+r.error.message);
}
async function loadPresets(){
  const r=await sb.from('presets').select('*').order('name');
  if(r.error)return toast('Could not load mixes: '+r.error.message);
  presets=r.data;drawPresets();
}
async function upload(){
  const f=$('file').files[0],name=$('sname').value.trim(),cat=$('scat').value;
  if(!f)return toast('Choose an audio file first.');
  if(!name)return toast('Give the sound a name.');
  if(!/\.(mp3|wav|ogg|m4a|aac|webm)$/i.test(f.name))return toast('Use an mp3, wav, ogg, m4a, aac or webm file.');
  if(f.size>MAX_MB*1048576)return toast('File is too big (max '+MAX_MB+' MB).');
  const b=$('ubtn');b.disabled=true;b.textContent='Uploading...';
  const path=user.id+'/sounds/'+Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');
  try{
    const up=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||'audio/mpeg'});if(up.error)throw up.error;
    const ins=await sb.from('sounds').insert({name,category:cat,storage_path:path});
    if(ins.error){await sb.storage.from(BUCKET).remove([path]);throw ins.error}
    $('file').value='';$('sname').value='';toast('Sound added.');await loadSounds();
  }catch(e){toast('Upload failed: '+e.message)}
  b.disabled=false;b.textContent='Upload';
}
async function delSound(s){
  if(!confirm('Delete "'+s.name+'"?'))return;
  const r=await sb.from('sounds').delete().eq('id',s.id);if(r.error)return toast(r.error.message);
  await sb.storage.from(BUCKET).remove([s.storage_path]);
  dropNode(s.id);delete levels[s.id];await loadSounds();
}
async function savePreset(){
  const name=$('pname').value.trim();if(!name)return toast('Name your mix first.');
  const lv={};sounds.forEach(s=>{if(levels[s.id]>0)lv[s.id]=Math.round(levels[s.id]*100)/100});
  const r=await sb.from('presets').upsert({user_id:user.id,name,levels:lv,visual,updated_at:new Date().toISOString()},{onConflict:'user_id,name'});
  if(r.error)return toast(r.error.message);
  $('pname').value='';toast('Mix saved.');await loadPresets();
}
function loadPreset(p){
  sounds.forEach(s=>{levels[s.id]=(p.levels&&p.levels[s.id])||0});
  visual=p.visual||'none';const vs=$('vsel');if(vs)vs.value=visual;
  drawSounds();sounds.forEach(s=>applyLevel(s.id));toast('Loaded "'+p.name+'"');
}
async function delPreset(p){
  if(!confirm('Delete mix "'+p.name+'"?'))return;
  const r=await sb.from('presets').delete().eq('id',p.id);if(r.error)return toast(r.error.message);
  await loadPresets();
}

/* ---------- UI ---------- */
/* ---------- visuals ---------- */
let visual='none',vraf=0,dim=1,fadeV=1,flashAt=-99,VS={};
const VOPTS=[['none','No visual'],['rain','Rain on window'],['glow','Glow particles'],['aurora','Aurora'],['ripples','Ripples'],['breathe','Breathing circle']];
const lv=c=>sounds.reduce((m,s)=>s.category===c?Math.max(m,levels[s.id]||0):m,0);
const rnd=(a,b)=>a+Math.random()*(b-a);
function makeBg(W,H){
  const b=document.createElement('canvas');b.width=W>>1;b.height=H>>1;
  const g=b.getContext('2d'),w=b.width,h=b.height,m=Math.min(w,h);
  const l=g.createLinearGradient(0,0,0,h);l.addColorStop(0,'#012a38');l.addColorStop(1,'#00101a');
  g.fillStyle=l;g.fillRect(0,0,w,h);g.globalCompositeOperation='lighter';
  const cols=['255,190,110','0,237,100','90,200,220','255,140,120','160,230,190'];
  for(let i=0;i<46;i++){
    const x=rnd(0,w),y=rnd(h*.2,h),r=rnd(.04,.14)*m,c=cols[i%cols.length],gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(${c},.55)`);gr.addColorStop(.65,`rgba(${c},.2)`);gr.addColorStop(1,`rgba(${c},0)`);
    g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);
  }
  return b;
}
function lens(c,bg,x,y,r,W,H){
  const S=r*6,kx=bg.width/W,ky=bg.height/H;
  c.save();c.beginPath();c.arc(x,y,r,0,6.3);c.clip();c.translate(x,y);c.rotate(Math.PI);
  try{c.drawImage(bg,(x-S/2)*kx,(y-S/2)*ky,S*kx,S*ky,-r,-r,2*r,2*r)}catch(e){}
  c.restore();
  c.strokeStyle='rgba(0,16,26,.5)';c.lineWidth=Math.max(1,r*.16);c.beginPath();c.arc(x,y,r,0,6.3);c.stroke();
  c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.arc(x-r*.35,y-r*.4,Math.max(.8,r*.2),0,6.3);c.fill();
}
const VIS={
  rain(c,W,H,t,dt){
    const r=lv('Rain'),u=Math.min(W,H)/700;
    if(!VS.bg){VS.bg=makeBg(W,H);VS.sl=[];VS.st=Array.from({length:70},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(1.5,4.5)*u}))}
    c.drawImage(VS.bg,0,0,W,H);
    if(Math.random()<(.15+r*1.4)*dt&&VS.sl.length<26)VS.sl.push({x:rnd(.03,.97)*W,y:rnd(0,.6)*H,r:rnd(4,9)*u,v:rnd(35,110)*u,mv:Math.random()<.5,tm:rnd(.3,1.5),tr:[]});
    if(Math.random()<(.4+r*3)*dt)VS.st.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1.2,3.5)*u});
    VS.sl=VS.sl.filter(d=>{
      d.tm-=dt;if(d.tm<=0){d.mv=!d.mv;d.tm=d.mv?rnd(.4,1.8):rnd(.3,2.2)}
      if(d.mv){d.y+=d.v*dt;d.tr.push([d.x+rnd(-.4,.4),d.y]);if(d.tr.length>34)d.tr.shift();
        if(Math.random()<1.4*dt)VS.st.push({x:d.x+rnd(-2,2)*u,y:d.y-d.r,r:rnd(1,2.2)*u})}
      return d.y<H+d.r*2});
    while(VS.st.length>150)VS.st.shift();
    c.lineCap='round';
    for(const d of VS.sl){if(d.tr.length>1){c.strokeStyle='rgba(215,240,240,.12)';c.lineWidth=d.r*.5;c.beginPath();c.moveTo(d.tr[0][0],d.tr[0][1]);for(const q of d.tr)c.lineTo(q[0],q[1]);c.stroke()}}
    for(const d of VS.st)lens(c,VS.bg,d.x,d.y,d.r,W,H);
    for(const d of VS.sl)lens(c,VS.bg,d.x,d.y,d.r,W,H);
  },
  glow(c,W,H,t,dt){
    const w=lv('Wind');
    if(!VS.p)VS.p=Array.from({length:50},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(20,70),vx:rnd(-8,8),vy:rnd(-10,-2),h:rnd(130,185),ph:rnd(0,6)}));
    c.globalCompositeOperation='lighter';
    for(const p of VS.p){
      const k=1+w*3;p.x+=p.vx*dt*k;p.y+=p.vy*dt*k;
      if(p.y<-p.r)p.y=H+p.r;if(p.x<-p.r)p.x=W+p.r;if(p.x>W+p.r)p.x=-p.r;
      const a=.16+.1*Math.sin(t*.8+p.ph),g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      g.addColorStop(0,`hsla(${p.h},90%,60%,${a})`);g.addColorStop(1,`hsla(${p.h},90%,60%,0)`);
      c.fillStyle=g;c.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);
    }
    c.globalCompositeOperation='source-over';
  },
  aurora(c,W,H,t){
    c.globalCompositeOperation='lighter';
    [[.35,150],[.5,170],[.62,185]].forEach(([y0,h],i)=>{
      const g=c.createLinearGradient(0,H*(y0-.3),0,H*(y0+.25));
      g.addColorStop(0,`hsla(${h},90%,55%,0)`);g.addColorStop(.5,`hsla(${h},90%,55%,.28)`);g.addColorStop(1,`hsla(${h},90%,55%,0)`);
      c.fillStyle=g;c.beginPath();c.moveTo(0,H);
      for(let x=0;x<=W;x+=16)c.lineTo(x,H*y0+Math.sin(x*.004+t*.35+i*2)*H*.08+Math.sin(x*.011-t*.5+i)*H*.03);
      c.lineTo(W,H);c.closePath();c.fill();
    });
    c.globalCompositeOperation='source-over';
  },
  ripples(c,W,H,t,dt){
    const r=lv('Rain');VS.r=VS.r||[];
    if(Math.random()<(.5+r*4)*dt)VS.r.push({x:rnd(.1,.9)*W,y:rnd(.15,.85)*H,age:0});
    c.lineWidth=2;
    VS.r=VS.r.filter(o=>{
      o.age+=dt;const k=o.age/4;if(k>1)return false;
      c.strokeStyle=`rgba(0,237,100,${.5*(1-k)})`;
      for(let j=0;j<3;j++){const kk=k-j*.08;if(kk>0){c.beginPath();c.arc(o.x,o.y,kk*Math.min(W,H)*.35,0,6.3);c.stroke()}}
      return true;
    });
  },
  breathe(c,W,H,t){
    const m=Math.min(W,H),ph=(t%8)/8,k=.5-.5*Math.cos(ph*2*Math.PI),R=m*(.14+.12*k);
    const g=c.createRadialGradient(W/2,H/2,R*.2,W/2,H/2,R*2.2);
    g.addColorStop(0,'rgba(0,237,100,.35)');g.addColorStop(1,'rgba(0,237,100,0)');
    c.fillStyle=g;c.fillRect(0,0,W,H);
    c.fillStyle='rgba(0,237,100,.85)';c.beginPath();c.arc(W/2,H/2,R,0,6.3);c.fill();
    c.fillStyle='rgba(232,237,235,.8)';c.font=Math.round(m*.04)+'px system-ui,sans-serif';c.textAlign='center';
    c.fillText(ph<.5?'Breathe in':'Breathe out',W/2,H/2+m*.4);
  }
};
function visFrame(now){
  const cv=$('cv');if(!cv||$('vis').hidden)return;
  const dt=Math.min(.05,(now-(visFrame.l||now))/1000);visFrame.l=now;const t=now/1000;
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  c.fillStyle='#001e2b';c.fillRect(0,0,W,H);
  const f=VIS[visual];if(f)f(c,W,H,t,dt);
  const th=lv('Thunder');if(playing&&th>.05&&t-flashAt>14&&Math.random()<.004*th)flashAt=t;
  const fa=t-flashAt;if(fa<1.8){c.fillStyle=`rgba(210,240,240,${.14*Math.sin(Math.PI*fa/1.8)})`;c.fillRect(0,0,W,H)}
  cv.style.opacity=dim*fadeV;
  vraf=requestAnimationFrame(visFrame);
}
function sizeVis(){const cv=$('cv'),d=Math.min(window.devicePixelRatio||1,1.5);cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);VS={}}
function openVis(){
  if(visual==='none')return toast('Choose a visual first.');
  $('vis').hidden=false;$('vis').classList.remove('hide');sizeVis();visFrame.l=0;
  cancelAnimationFrame(vraf);vraf=requestAnimationFrame(visFrame);updatePlay();
}
function closeVis(){$('vis').hidden=true;cancelAnimationFrame(vraf)}
window.addEventListener('resize',()=>{const v=$('vis');if(v&&!v.hidden)sizeVis()});
window.addEventListener('keydown',e=>{const v=$('vis');if(e.key==='Escape'&&v&&!v.hidden)closeVis()});

function slider(val,label,set){
  const i=h('input',{type:'range',min:'0',max:'100',value:String(val),'aria-label':label});
  i.oninput=()=>set(i.value/100);
  let sx=0,sy=0,prev=i.value;
  const undo=()=>{if(i.value!==prev){i.value=prev;set(prev/100)}};
  i.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;prev=i.value},{passive:true});
  i.addEventListener('touchmove',e=>{const t=e.touches[0],dy=Math.abs(t.clientY-sy);if(dy>10&&dy>Math.abs(t.clientX-sx))undo()},{passive:true});
  i.addEventListener('touchcancel',undo);
  return i;
}
function drawSounds(){
  const g=$('grid');if(!g)return;
  if(!sounds.length){g.replaceChildren(h('p',{class:'mute'},'No sounds yet. Add your first sound below.'));return}
  g.replaceChildren(...sounds.map(s=>h('div',{class:'card sound'},
    h('div',{class:'row'},h('strong',{},s.name),h('span',{class:'pill'},s.category)),
    slider(Math.round((levels[s.id]||0)*100),s.name+' volume',v=>{levels[s.id]=v;applyLevel(s.id)}),
    h('div',{class:'row'},h('span',{class:'mute'},s.builtin?'Built-in':''),s.builtin?null:h('button',{class:'btn danger',onclick:()=>delSound(s)},'Delete')))));
}
function drawPresets(){
  const m=$('mixes');if(!m)return;
  if(!presets.length){m.replaceChildren(h('p',{class:'mute'},'No saved mixes yet.'));return}
  m.replaceChildren(...presets.map(p=>h('div',{class:'mix'},h('strong',{},p.name),
    h('div',{class:'row'},h('button',{class:'btn primary',onclick:()=>loadPreset(p)},'Load'),
      h('button',{class:'btn danger',onclick:()=>delPreset(p)},'Delete')))));
}

  $('app').replaceChildren(
    h('header',{class:'top'},h('div',{class:'brand'},h('span',{id:'hlogo',class:'logo','aria-hidden':'true'}),h('h1',{},'Hushwave')),h('div',{class:'row'},h('button',{class:'icon-btn','aria-label':'Help: how to mix',title:'How to mix',onclick:()=>$('help').showModal()},'?'),h('button',{class:'btn',onclick:()=>sb.auth.signOut()},'Log out'))),

        h('div',{class:'row nw'},h('select',{id:'tsel','aria-label':'Sleep timer minutes'},...[15,30,60,90].map(m=>h('option',{value:m},m+' min'))),
          h('button',{class:'btn sm',onclick:()=>startTimer(+$('tsel').value)},'Start'),

      h('div',{class:'grp'},h('div',{class:'mute'},'Visual'),h('div',{class:'row nw'},h('select',{id:'vsel','aria-label':'Visual',onchange:e=>{visual=e.target.value}},...VOPTS.map(([v,n])=>h('option',{value:v},n))),h('button',{class:'btn sm',onclick:openVis},'Show')))),
    h('div',{id:'vis',class:'vis',hidden:''},h('canvas',{id:'cv'}),h('div',{class:'vbar'},h('button',{id:'vplay',class:'btn primary sm',onclick:togglePlay},'Play'),h('label',{class:'mute'},'Dim',slider(100,'Dim',v=>{dim=Math.max(.15,v)})),h('button',{class:'btn sm',onclick:closeVis},'Close'))),
    h('dialog',{id:'help',class:'help'},
      h('div',{class:'row',style:'justify-content:space-between'},h('h2',{style:'margin:0'},'How to mix / Mix kaise banayein'),h('button',{class:'btn',onclick:()=>$('help').close()},'Close')),
      h('div',{class:'guide'},
        h('div',{},h('strong',{},'English'),h('ol',{},...GUIDE.en.map(t=>h('li',{},t)))),

    h('h2',{},'Sounds'),h('div',{id:'grid',class:'grid'}),
    h('h2',{},'Your mixes'),
    h('section',{class:'card'},
      h('div',{class:'row mixsave'},h('input',{id:'pname',placeholder:'Mix name, e.g. Rainy Night',maxlength:'60'}),

      h('div',{id:'mixes'})),
    h('h2',{},'Add a sound'),
    h('section',{class:'card'},
      h('p',{class:'mute'},'mp3, wav, ogg, m4a, aac or webm. Max '+MAX_MB+' MB. A 30 to 90 second loop works best.'),
      h('div',{class:'row'},h('input',{id:'file',type:'file',accept:'audio/*,.mp3,.wav,.ogg,.m4a,.aac,.webm'}),
        h('input',{id:'sname',placeholder:'Sound name',maxlength:'60'}),
        h('select',{id:'scat','aria-label':'Category'},...CATS.map(c=>h('option',{value:c},c))),
        h('button',{id:'ubtn',class:'btn primary',onclick:upload},'Upload'))));
  $('hlogo').innerHTML=LOGO;$('vsel').value=visual;$('cv').onclick=()=>$('vis').classList.toggle('hide');$('help').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});updatePlay();loadSounds();loadPresets();
}
