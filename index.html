<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--bg:#1f1d3d;--card:#2b2950;--deep:#35325f;--green:#00ed64;--text:#e8edeb;--mute:#a9b8b8;--line:rgba(255,255,255,.14);--danger:#ff6f61}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Euclid Circular A",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
@media(min-width:768px){.wrap{padding:24px 32px}}
h1{font-size:28px;margin:0}h2{font-size:20px;margin:28px 0 12px}
.logo{display:inline-flex;line-height:0}.wv{transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.45)}}
.playing .wv{animation:pulse 1.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.playing .wv{animation:none}}
.brand{display:flex;align-items:center;gap:12px}
.auth img{align-self:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.mute{color:var(--mute);margin:8px 0}
.btn{min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--green);background:transparent;color:var(--green);font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--green);color:var(--bg)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
input,select{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font:inherit;max-width:100%}
input[type=range]{width:100%;padding:0;accent-color:var(--green);touch-action:pan-y}
input[type=file]{padding:8px 12px}
.ctrl,.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ctrl>*{min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sound{display:flex;flex-direction:column;gap:6px}
.sound .row{justify-content:space-between}
.pill{border:1px solid var(--green);color:var(--green);border-radius:999px;padding:0 10px;font-size:13px}
.mix{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.auth{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.auth input{width:100%}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--green);background:transparent;color:var(--green);font:inherit;font-weight:700;font-size:20px;cursor:pointer}
dialog.help{width:min(92vw,900px);max-height:85vh;overflow:auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:16px}
dialog.help::backdrop{background:rgba(0,0,0,.65)}
.btn.sm{min-height:40px;padding:0 16px;font-size:15px}
.top{flex-wrap:nowrap;gap:8px}.brand{min-width:0}
.brand h1{font-size:clamp(20px,6vw,28px);white-space:nowrap}
.logo svg{width:clamp(30px,9vw,40px);height:clamp(30px,9vw,40px)}
.top .row{flex-wrap:nowrap;gap:8px}
.top .btn{min-height:36px;padding:0 14px;font-size:14px}
.icon-btn{width:36px;height:36px;font-size:17px}
[hidden]{display:none!important}
.vis{position:fixed;inset:0;z-index:60;background:#120f2e}.vis canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vbar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:linear-gradient(transparent,rgba(18,15,46,.9));transition:opacity .3s}
.vbar label{display:flex;align-items:center;gap:8px;min-width:140px}
.vis.hide .vbar{opacity:0;pointer-events:none}
.vname{position:absolute;left:0;right:0;top:calc(18px + env(safe-area-inset-top));text-align:center;font-size:18px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);opacity:0;transition:opacity .4s;pointer-events:none}.vname.show{opacity:1}
.grp{flex:1 1 220px;min-width:0}.nw{flex-wrap:nowrap;gap:8px}.nw select{flex:1;min-width:0}
.mixsave{margin-bottom:14px}.mixsave input{flex:1;min-width:150px}
.guide{display:grid;gap:16px;margin-top:12px}
@media(min-width:768px){.guide{grid-template-columns:1fr 1fr}}
.guide>div{background:#d7f3e3;color:#001e2b;border-radius:12px;padding:14px 18px}
.guide ol{margin:8px 0 0;padding-left:22px}.guide li{margin:8px 0;line-height:1.6}
summary{cursor:pointer;font-weight:600;min-height:32px}
@media(prefers-reduced-motion:no-preference){.tile{transition:background .2s,border-color .2s}}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{--c:#c8e6cd;position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px;cursor:pointer;min-height:108px;display:flex;flex-direction:column;gap:6px;user-select:none}
.tile.on{background:var(--c);border-color:var(--c);color:#000}
.tile .ic{font-size:26px;line-height:1}
.tile small{color:var(--mute)}.tile.on small{color:#333}
.tile input[type=range]{accent-color:#000}
.tile .del{position:absolute;top:8px;right:10px;background:none;border:none;color:inherit;opacity:.7;font:inherit;font-size:12px;cursor:pointer;padding:4px}
.dd{width:100%;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--text);font:inherit;cursor:pointer;margin-top:14px}
.dd b{flex:1;text-align:right;font-weight:600}
.pop{background:var(--deep);border:1px solid var(--line);border-radius:20px;padding:8px;margin-top:8px}
.pop .mix{border-top:0;padding:8px 10px;border-radius:14px;cursor:pointer}.pop .mix:hover{background:rgba(255,255,255,.08)}
.del2{background:none;border:none;color:var(--danger);font:inherit;font-size:13px;cursor:pointer;padding:6px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .pl{width:60px;height:60px;border-radius:50%;border:none;background:#fff;color:var(--bg);font-size:22px;cursor:pointer;padding:0}
.dock .ib{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--mute);font:inherit;font-size:12px;cursor:pointer}
.dock .ib span{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.wrap{padding-bottom:130px}
dialog.mini{width:min(92vw,420px);background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:16px}
dialog.mini::backdrop{background:rgba(0,0,0,.65)}
.tile.ld::after{content:'Loading...';position:absolute;right:12px;bottom:10px;font-size:12px;opacity:.7}
#toast{bottom:calc(110px + env(safe-area-inset-bottom))!important}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:10px 16px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div id="toast" role="status"></div>
<script>
const SB_URL='https://mqlqjydyjubhaoiyvtny.supabase.co';
const SB_KEY='sb_publishable_1NXgtoht79YC3NLtAIm-9g_P07tY89x';
const BUCKET='hushwave-media',MAX_MB=15,CATS=['Rain','Wind','Thunder','Tapping','Brushing','Fire','Water','Night','Other'];
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
let user=null,sounds=[],presets=[],levels={},nodes={},bad={},playing=false,ctx=null,master=null,masterVol=1,timer=null,booted=false,curId=null;

function h(tag,props={},...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){if(k==='class')e.className=v;else if(k.startsWith('on'))e[k]=v;else e.setAttribute(k,v)}
  for(const c of kids.flat())if(c!=null)e.append(c);return e}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3500)}

/* ---------- auth ---------- */
function showAuth(){
  let mode='login';
  const msg=h('p',{class:'mute'});
  const email=h('input',{type:'email',placeholder:'Email',autocomplete:'email'});
  const pass=h('input',{type:'password',placeholder:'Password (min 6 characters)',autocomplete:'current-password'});
  const sw=h('button',{class:'btn',type:'button'},'Create a new account');
  const btn=h('button',{class:'btn primary',type:'submit'},'Log in');
  const form=h('form',{class:'auth'},h('img',{src:'logo.svg',alt:'Hushwave logo',width:'72',height:'72'}),h('h1',{style:'text-align:center'},'Hushwave'),h('p',{class:'mute'},'Mix calming sounds. Sleep easy.'),email,pass,btn,sw,msg);
  sw.onclick=()=>{mode=mode==='login'?'signup':'login';btn.textContent=mode==='login'?'Log in':'Create account';sw.textContent=mode==='login'?'Create a new account':'I already have an account';msg.textContent=''};
  form.onsubmit=async ev=>{ev.preventDefault();msg.textContent='';
    const e=email.value.trim(),p=pass.value;
    if(!e||p.length<6){msg.textContent='Enter an email and a password of at least 6 characters.';return}
    btn.disabled=true;
    const r=mode==='login'?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p});
    btn.disabled=false;
    if(r.error)msg.textContent=r.error.message;
    else if(!r.data.session)msg.textContent='Check your email to confirm your account, then log in.'};
  $('app').replaceChildren(form);
}
sb.auth.onAuthStateChange((ev,session)=>{
  const id=session&&session.user?session.user.id:null;
  if(booted&&id===curId)return;
  booted=true;curId=id;user=session?session.user:null;
  setTimeout(()=>{if(user)startApp();else{stopAudio();showAuth()}},0);
});

const LOGO='<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Hushwave logo"><rect width="100" height="100" rx="22" fill="#c9f7dc"/><g stroke="#003d4f" stroke-width="12" stroke-linecap="round"><path d="M34 28V72M66 28V72"/></g><polyline class="wv" points="16.0,50.0 17.1,52.1 18.3,54.1 19.4,55.9 20.5,57.4 21.7,58.7 22.8,59.5 23.9,59.9 25.1,59.9 26.2,59.5 27.3,58.7 28.5,57.4 29.6,55.9 30.7,54.1 31.9,52.1 33.0,50.0 34.1,47.9 35.3,45.9 36.4,44.1 37.5,42.6 38.7,41.3 39.8,40.5 40.9,40.1 42.1,40.1 43.2,40.5 44.3,41.3 45.5,42.6 46.6,44.1 47.7,45.9 48.9,47.9 50.0,50.0 51.1,52.1 52.3,54.1 53.4,55.9 54.5,57.4 55.7,58.7 56.8,59.5 57.9,59.9 59.1,59.9 60.2,59.5 61.3,58.7 62.5,57.4 63.6,55.9 64.7,54.1 65.9,52.1 67.0,50.0 68.1,47.9 69.3,45.9 70.4,44.1 71.5,42.6 72.7,41.3 73.8,40.5 74.9,40.1 76.1,40.1 77.2,40.5 78.3,41.3 79.5,42.6 80.6,44.1 81.7,45.9 82.9,47.9 84.0,50.0" fill="none" stroke="#00b84f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const BUILTINS=[
  {id:'b:light-rain-leaves',name:'Light rain drips on leaves',category:'Rain',builtin:true,url:'sounds/light-rain-leaves.mp3'},
  {id:'b:rain-4',name:'Rain 4',category:'Rain',builtin:true,url:'sounds/rain-4.mp3'},
  {id:'b:winchester-wind',name:'Winchester wind ambience',category:'Wind',builtin:true,url:'sounds/winchester-wind.mp3'},
  {id:'b:gentle-breeze',name:'A gentle breeze wind 2',category:'Wind',builtin:true,url:'sounds/gentle-breeze.mp3'},
  {id:'b:distant-thunder',name:'Rolling distant thunder in heavy rain 06',category:'Thunder',builtin:true,url:'sounds/distant-thunder.mp3'},
  {id:'b:long-thunder',name:'Long thunder edited',category:'Thunder',builtin:true,url:'sounds/long-thunder.mp3'},
  {id:'b:brushing-hairbrush',name:'Brushing the hairbrush',category:'Brushing',builtin:true,url:'sounds/brushing-hairbrush.mp3'},
  {id:'b:brushing-hair',name:'Brushing hair',category:'Brushing',builtin:true,url:'sounds/brushing-hair.mp3'},
  {id:'b:scrubbing-brush',name:'Scrubbing brush',category:'Brushing',builtin:true,url:'sounds/scrubbing-brush.mp3'},
  {id:'b:tapping-fingers',name:'Tapping fingers',category:'Tapping',builtin:true,url:'sounds/tapping-fingers.mp3'},
  {id:'b:nails-tapping',name:'Nails tapping of hard surface',category:'Tapping',builtin:true,url:'sounds/nails-tapping.mp3'},
  {id:'b:fingers-tapping',name:'Fingers tapping',category:'Tapping',builtin:true,url:'sounds/fingers-tapping.mp3'},
  {id:'b:keyboard-tapping',name:'Keyboard tapping',category:'Tapping',builtin:true,url:'sounds/keyboard-tapping.mp3'},
  {id:'b:scratching-fast',name:'Scratching fast',category:'Brushing',builtin:true,url:'sounds/scratching-fast.mp3'}];
const GUIDE={en:[
 'Tap a sound tile to switch it on. Drag its slider to make it louder or softer. Tap the tile again to switch it off.',
 'Tap the big round button at the bottom to play or pause.',
 'Open My mixes at the top, type a name and press Save to keep your mix. Tap a saved mix to load it.',
 'The moon button sets a sleep timer. The sparkles button opens full-screen visuals.',
 'Add your own sounds at the bottom of the page.'],
ur:[
 'Kisi awaaz ke tile par dabayein, woh on ho jati hai. Us ka slider khench kar awaaz kam ya zyada karein. Dobara dabane se woh off ho jati hai.',
 'Neeche bade gol button se Play ya Pause karein.',
 'Upar My mixes kholein, naam likh kar Save dabayein, to mix mehfooz ho jati hai. Saved mix par dabane se woh load ho jati hai.',
 'Chand wala button sleep timer lagata hai. Sitaron wala button poori screen ke visuals kholta hai.',
 'Apni awaazein page ke neeche se add karein.']};

/* ---------- audio ---------- */
function ensureCtx(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=masterVol;master.connect(ctx.destination);an=ctx.createAnalyser();an.fftSize=256;master.connect(an)}return ctx}
async function startNode(id){
  if(!ctx||nodes[id]||bad[id])return;
  const s=sounds.find(x=>x.id===id);if(!s)return;
  setLd(id,true);
  const n=nodes[id]={gain:ctx.createGain()};n.gain.gain.value=levels[id]||0;n.gain.connect(master);
  try{
    let ab;
    if(s.builtin){ab=await fetchCached(s.url)}
    else{const r=await sb.storage.from(BUCKET).download(s.storage_path);if(r.error)throw r.error;ab=await r.data.arrayBuffer()}
    const buf=await ctx.decodeAudioData(ab);
    if(nodes[id]!==n)return;
    const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;src.connect(n.gain);src.start();n.src=src;
  }catch(e){if(nodes[id]===n)delete nodes[id];bad[id]=true;toast('Could not play "'+s.name+'". Try an mp3 or wav file.')}finally{setLd(id,false)}
}
function dropNode(id){const n=nodes[id];if(!n)return;try{n.src&&n.src.stop()}catch(e){}try{n.gain.disconnect()}catch(e){}delete nodes[id]}
function applyLevel(id){
  const n=nodes[id];
  if(n&&ctx)n.gain.gain.setTargetAtTime(levels[id]||0,ctx.currentTime,.05);
  else if(playing&&levels[id]>0)startNode(id);
  saveState();
}
async function togglePlay(){
  if(playing){await ctx.suspend();playing=false}
  else{
    if(!sounds.some(s=>levels[s.id]>0))toast('Move a slider up to hear a sound.');
    ensureCtx();await ctx.resume();playing=true;
    sounds.forEach(s=>{if(levels[s.id]>0)startNode(s.id)});
  }
  updatePlay();
}
function updatePlay(){keepAudio(playing);document.body.classList.toggle('playing',playing);const vb=$('vplay');if(vb){vb.textContent=playing?'Pause':'Play';vb.className=playing?'btn sm':'btn primary sm'}const b=$('play');if(!b)return;b.textContent=playing?'\u275A\u275A':'\u25B6';b.setAttribute('aria-label',playing?'Pause':'Play')}
function stopAudio(){clearInterval(timer);timer=null;Object.keys(nodes).forEach(dropNode);if(ctx){try{ctx.close()}catch(e){}}
  ctx=null;master=null;an=null;nodes={};bad={};playing=false;levels={};sounds=[];presets=[]}
function setMaster(v){masterVol=v;saveState();if(master)master.gain.setTargetAtTime(v,ctx.currentTime,.05)}

/* ---------- sleep timer ---------- */
const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function startTimer(min){
  cancelTimer();const end=Date.now()+min*60000;
  timer=setInterval(async()=>{
    const r=end-Date.now();
    if(r<=0){clearInterval(timer);timer=null;$('tlabel').textContent='';
      if(playing)await togglePlay();setMaster(masterVol);closeVis();fadeV=1;return}
    if(r<=8000&&master){master.gain.setTargetAtTime(0,ctx.currentTime,2);fadeV=Math.max(0,r/8000)}
    $('tlabel').textContent=fmt(r)+' left';
  },1000);
  toast('Sleep timer started: '+min+' min');
}
function cancelTimer(){fadeV=1;if(timer){clearInterval(timer);timer=null;if($('tlabel'))$('tlabel').textContent='';if(master)master.gain.setTargetAtTime(masterVol,ctx.currentTime,.05)}}

/* ---------- data ---------- */
async function loadSounds(){
  const r=await sb.from('sounds').select('*').order('created_at');
  sounds=BUILTINS.concat(r.error?[]:r.data);restoreState();drawSounds();
  if(r.error)toast('Could not load sounds: '+r.error.message);
}
async function loadPresets(){
  const r=await sb.from('presets').select('*').order('name');
  if(r.error)return toast('Could not load mixes: '+r.error.message);
  presets=r.data;drawPresets();
}
async function upload(){
  const f=$('file').files[0],name=$('sname').value.trim(),cat=$('scat').value;
  if(!f)return toast('Choose an audio file first.');
  if(!name)return toast('Give the sound a name.');
  if(!/\.(mp3|wav|ogg|m4a|aac|webm)$/i.test(f.name))return toast('Use an mp3, wav, ogg, m4a, aac or webm file.');
  if(f.size>MAX_MB*1048576)return toast('File is too big (max '+MAX_MB+' MB).');
  const b=$('ubtn');b.disabled=true;b.textContent='Uploading...';
  const path=user.id+'/sounds/'+Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');
  try{
    const up=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||'audio/mpeg'});if(up.error)throw up.error;
    const ins=await sb.from('sounds').insert({name,category:cat,storage_path:path});
    if(ins.error){await sb.storage.from(BUCKET).remove([path]);throw ins.error}
    $('file').value='';$('sname').value='';toast('Sound added.');await loadSounds();
  }catch(e){toast('Upload failed: '+e.message)}
  b.disabled=false;b.textContent='Upload';
}
async function delSound(s){
  if(!confirm('Delete "'+s.name+'"?'))return;
  const r=await sb.from('sounds').delete().eq('id',s.id);if(r.error)return toast(r.error.message);
  await sb.storage.from(BUCKET).remove([s.storage_path]);
  dropNode(s.id);delete levels[s.id];await loadSounds();
}
async function savePreset(){
  const name=$('pname').value.trim();if(!name)return toast('Name your mix first.');
  const lv={};sounds.forEach(s=>{if(levels[s.id]>0)lv[s.id]=Math.round(levels[s.id]*100)/100});
  const r=await sb.from('presets').upsert({user_id:user.id,name,levels:lv,visual,updated_at:new Date().toISOString()},{onConflict:'user_id,name'});
  if(r.error)return toast(r.error.message);
  $('pname').value='';toast('Mix saved.');const cm=$('curmix');if(cm)cm.textContent=name;closePop();await loadPresets();
}
function randomMix(){
  if(!sounds.length)return;
  const pool=sounds.slice().sort(()=>Math.random()-.5),n=Math.min(pool.length,2+Math.floor(Math.random()*3)),pick=new Set(pool.slice(0,n).map(s=>s.id));
  sounds.forEach(s=>{levels[s.id]=pick.has(s.id)?Math.round((.25+Math.random()*.55)*20)/20:0});
  drawSounds();sounds.forEach(s=>applyLevel(s.id));
  curMixName='Random mix';const cm=$('curmix');if(cm)cm.textContent='Random mix';closePop();saveState();
  toast('Random mix: '+pool.slice(0,n).map(s=>s.name).join(', '));
}
function loadPreset(p){
  sounds.forEach(s=>{levels[s.id]=(p.levels&&p.levels[s.id])||0});
  visual=p.visual||'none';const vs=$('vsel');if(vs)vs.value=visual;
  drawSounds();sounds.forEach(s=>applyLevel(s.id));toast('Loaded "'+p.name+'"');const cm=$('curmix');if(cm)cm.textContent=p.name;closePop();
}
async function delPreset(p){
  if(!confirm('Delete mix "'+p.name+'"?'))return;
